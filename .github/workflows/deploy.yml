name: Deploy MentorCEO Landing Page
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Create .env.local
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" >> .env.local
          echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}" >> .env.local

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Cloudflare credentials
        run: |
          mkdir -p $HOME/.config/.wrangler/config
          echo "oauth_token = \"${{ secrets.CF_OAUTH_TOKEN }}\"" > $HOME/.config/.wrangler/config/default.toml

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@3 pages deploy out --project-name=mentorceo-landing --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
